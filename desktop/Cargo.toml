[package]
name = "algo-desktop"
version = "0.1.8"
edition = "2021"
description = "Dedicated native desktop shell for the Rust algo app (embedded WebView2 / WebKit, zero UI porting)"
license = "MIT"

[[bin]]
name = "algo-desktop"
path = "src/main.rs"

[dependencies]
wry = "0.53"
tao = "0.34"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "2.10"
semver = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
sha2 = "0.10"
hex = "0.4"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"

[workspace]
