<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trade Stats - Dhan Algo</title>
<link rel="stylesheet" href="./app.css?v=14">
<style>
  body { display: flex; flex-direction: column; height: 100%; }
  .paper-banner {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    padding: 6px 10px; background: #1a1030; border-bottom: 1px solid #4a2d7e;
    font-size: 11px; color: #c4a9ff;
  }
  .paper-banner b { color: #e6d9ff; letter-spacing: .3px; }
  .paper-banner span { color: #9a86c8; }
  .tab-content { flex: 1 1 auto; height: auto; min-height: 0; display: block; }
  #tab-rtstats { overflow-y: auto; }
</style>
</head>
<body data-tab="paperstats">
<div class="paper-banner">
  <b>Trade Stats</b>
  <span>Executed-trades report for the paper engines: every entry/exit here is a simulated fill booked locally - no real orders are ever sent.</span>
</div>
<div class="tab-content" id="tab-rtstats"></div>

<script src="./vendor/chart.umd.min.js"></script>
<script>
  // Mark this as the paper report (used for the CSV filename) and route every
  // /api/rt call made by the shared stats UI to the paper engine (`/api/paper/*`).
  window.__PAPER__ = true;
  (function () {
    const orig = window.fetch.bind(window);
    window.fetch = function (u, o) {
      if (typeof u === "string" && u.indexOf("/api/rt") === 0) {
        u = "/api/paper" + u.slice("/api/rt".length);
      }
      return orig(u, o);
    };
  })();
  // Poll only while this pane is actually visible in the parent tab switcher.
  (function () {
    const root = document.getElementById("tab-rtstats");
    const visible = function () {
      const fe = window.frameElement;
      if (!fe) return true;
      return !!(fe.offsetParent && fe.clientHeight > 0);
    };
    const sync = function () { root.classList.toggle("active", visible()); };
    setInterval(sync, 500);
    sync();
  })();
</script>
<script type="module">
  import { bootRtStats } from "./rtstats.js?v=6";
  import { bootTheme } from "./theme.js?v=4";
  import { bootTextSize } from "./textsize.js?v=1";
  bootRtStats();
  bootTheme();
  bootTextSize();
  const head = document.querySelector("#tab-rtstats .rs-toolbar h3");
  if (head) head.textContent = "Paper Trade Executed Trades Report";
  const desc = document.querySelector("#tab-rtstats .rs-toolbar span");
  if (desc) desc.textContent = "Aggregates every executed trade from the paper engines (simulated fills, no real orders). Net basis when charges are banked.";
</script>
</body>
</html>
