<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paper Trade 2 - Dhan Algo</title>
<link rel="stylesheet" href="./app.css?v=14">
<style>
  body { display: flex; flex-direction: column; height: 100%; }
  .paper-banner {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    padding: 6px 10px; background: #102030; border-bottom: 1px solid #2d5a7e;
    font-size: 11px; color: #a9d0ff;
  }
  .paper-banner b { color: #d9ecff; letter-spacing: .3px; }
  .paper-banner span { color: #86a8c8; }
  .tab-content { flex: 1 1 auto; height: auto; min-height: 0; display: block; }
  #tab-realtime { overflow-y: auto; }
</style>
</head>
<body data-tab="papertrade">
<div class="paper-banner">
  <b>Paper Trade 2</b>
  <span>Independent paper engine: live Dhan feed ke saath simulated execution. Iska apna settings, strategies, positions aur P&amp;L book hai - Paper Trade (tab 1) se koi data share nahi hota. Koi real order nahi jata.</span>
</div>
<div class="tab-content" id="tab-realtime"></div>

<script>
  // Tell the shared realtime module it is rendering inside a Paper frame so its
  // operator-facing wording (engine toggle, square-off, status pill) says
  // "simulated" instead of "LIVE Dhan orders".
  window.__PAPER__ = true;
  // This is the SECOND, fully independent paper engine: every shared-UI call is
  // routed to `/api/paper2/*`, which persists to its own state file.
  window.__PAPER_BASE__ = "/api/paper2";
  // Route every /api/rt call made by the shared realtime UI to THIS paper engine
  // (`/api/paper2/*`), so the exact same pane logic drives this simulated book.
  (function () {
    const orig = window.fetch.bind(window);
    window.fetch = function (u, o) {
      if (typeof u === "string" && u.indexOf("/api/rt") === 0) {
        u = "/api/paper2" + u.slice("/api/rt".length);
      }
      return orig(u, o);
    };
  })();
  // Poll only while this pane is actually visible in the parent tab switcher.
  // The shared realtime UI refreshes at 1s only while `#tab-realtime.active` is
  // present, so we toggle it from the iframe's real layout visibility instead of
  // polling forever in a hidden tab. Standalone use (no parent) stays active.
  (function () {
    const root = document.getElementById("tab-realtime");
    const visible = function () {
      const fe = window.frameElement;
      if (!fe) return true;
      return !!(fe.offsetParent && fe.clientHeight > 0);
    };
    const sync = function () { root.classList.toggle("active", visible()); };
    setInterval(sync, 500);
    sync();
  })();
  // Bridge the main window's chart selection so "Use chart symbol" works inside
  // this paper frame (same origin). Read on demand and re-dispatch when the
  // parent announces a new chart selection so the order card re-prices live.
  (function () {
    try {
      Object.defineProperty(window, "__chartSelection", {
        configurable: true,
        get: function () {
          try { return window.parent && window.parent.__chartSelection; } catch (e) { return null; }
        },
      });
    } catch (e) { /* non-fatal: paper just falls back to the catalog */ }
    window.addEventListener("message", function (ev) {
      if (ev.data && ev.data.type === "chartselection") {
        window.dispatchEvent(new CustomEvent("chartselection"));
      }
    });
  })();
</script>
<script type="module">
  import { bootRealtime } from "./realtime.js?v=108";
  import { bootTextSize } from "./textsize.js?v=1";
  bootRealtime();
  bootTextSize();
  const title = document.querySelector("#tab-realtime .rt-strip .rt-title");
  if (title) title.textContent = "Paper Trade 2 (Simulated)";
  // Paper-only controls: the simulated wallet + fill model. Each is a normal
  // `data-set` setting, so the shared pane reads the value back into the field
  // on every refresh and includes it in any full settings write. These settings
  // exist only on the paper engine, so they never show in the RT tab.
  (function () {
    const funds = document.getElementById("rtFundsPill");
    if (!funds) return;
    const box = function (label, key, attrs) {
      return '<label class="rt-pill" style="display:flex;align-items:center;gap:4px">' + label +
        '<input type="number" data-set="' + key + '" ' + attrs +
        ' style="width:78px;background:#0a0a18;color:#e0e0ff;border:1px solid #3a3a60;border-radius:3px;padding:1px 4px;font-size:10px">' +
        "</label>";
    };
    funds.insertAdjacentHTML(
      "afterend",
      box("Capital \u20b9", "paperCapital", 'min="0" step="10000"') +
        box("Margin \u20b9", "marginAmount", 'min="0" step="10000" title="Manual margin amount (rupees): the paper engine locks at most this much across running trades, capped by the available capital. 0 = use the Margin-to-use % instead."') +
        box("Slippage bps", "paperSlippageBps", 'min="0" step="0.5"') +
        box("Reject %", "paperRejectPct", 'min="0" max="100" step="1"') +
        '<label class="rt-pill" style="display:flex;align-items:center;gap:4px;color:#ffd700" ' +
          'title="Deduct simulated Dhan broker charges (STT, brokerage, NSE txn, SEBI, stamp, IPFT and 18% GST) from paper P&L. Off = gross P&L.">' +
          '<input type="checkbox" data-set="brokerCharges" style="accent-color:#ffd700"> Deduct Dhan charges</label>' +
        '<label class="rt-pill" style="display:flex;align-items:center;gap:4px;color:#00d4aa" ' +
          'title="Paper execution latency: entry condition meet hone par trade turant nahi, yahan set kiye gaye milliseconds ke baad execute hoga (real order latency ki tarah). Checkbox off = bilkul inactive, trade turant.">' +
          '<input type="checkbox" data-set="paperExecDelayOn" style="accent-color:#00d4aa"> Exec delay' +
          '<input type="number" data-set="paperExecDelayMs" min="0" step="50"' +
          ' style="width:70px;background:#0a0a18;color:#e0e0ff;border:1px solid #3a3a60;border-radius:3px;padding:1px 4px;font-size:10px"> ms</label>' +
        '<label class="rt-pill" style="display:flex;align-items:center;gap:4px;color:#ff7b72" ' +
          'title="Paper exit latency: SL / Trail-SL / Target par trade turant nahi, yahan set kiye gaye milliseconds ke baad cut hoga. Book wahi level par hoga jo bina delay hota (SL par SL, Trail par Trail, Target par Target) - delay sirf cut ko late karta hai, price ko badalta nahi. Checkbox off = exit turant.">' +
          '<input type="checkbox" data-set="paperExitDelayOn" style="accent-color:#ff7b72"> Exit delay' +
          '<input type="number" data-set="paperExitDelayMs" min="0" step="50"' +
          ' style="width:70px;background:#0a0a18;color:#e0e0ff;border:1px solid #3a3a60;border-radius:3px;padding:1px 4px;font-size:10px"> ms</label>' +
        '<label class="rt-pill" style="display:flex;align-items:center;gap:4px;color:#00d4aa" ' +
          'title="ON: agar required margin available se zyada ho (funds kam / margin cap), to signal turant SKIP ho jayega - wo trade late/retry par kabhi nahi khulegi. OFF: purana behaviour (margin free hone par wahi signal baad me fill ho sakta hai).">' +
          '<input type="checkbox" data-set="skipOnMarginBlock" style="accent-color:#00d4aa"> Skip if no margin</label>' +
        '<label class="rt-pill" style="display:flex;align-items:center;gap:4px;color:#ffb74d" ' +
          'title="F&O Limit entry (paper only, buying only): buy entry ko Dhan ki tarah market se upar limit price par lagata hai, jisse order 100% fill hota hai (market order jaisa). Limit kabhi entry se neeche nahi lagti; sell par lagu nahi hota.">' +
          '<input type="checkbox" data-set="fnoLimitOrder" style="accent-color:#ffb74d"> F&O Limit</label>' +
        '<label class="rt-pill" style="display:flex;align-items:center;gap:4px;color:#00d4aa" ' +
          'title="ON: paper wallet ka base Margin \u20b9 field ban jata hai (Capital nahi) aur realized P&amp;L usi margin ko ghatata/badhata hai - real account ki tarah. Jaise Margin 300000 set karo: 10000 loss par 290000, 15000 profit par 315000. Jab tak Reset Margin na dabao, yahi chalta rahega. OFF: purana static capital wallet.">' +
          '<input type="checkbox" data-set="dynamicMarginOn" style="accent-color:#00d4aa"> Dynamic margin</label>' +
        '<button type="button" class="btn-action warn" id="rtResetMargin" style="width:auto;padding:2px 10px;margin:0;font-size:10px" ' +
          'title="Margin ko set amount par wapas laao aur poora paper book (closed trades + logs) clear karo - clean slate se agla trade.">Reset Margin</button>'
    );
    const post = function (key, raw, clamp) {
      const v = clamp(Math.max(0, Number(raw) || 0));
      fetch("/api/rt/settings", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ [key]: v }),
      });
      return v;
    };
    const bind = function (key, clamp) {
      const inp = funds.parentNode.querySelector('input[data-set="' + key + '"]');
      if (!inp) return;
      inp.addEventListener("change", function () { inp.value = post(key, inp.value, clamp); });
    };
    bind("paperCapital", function (v) { return v; });
    bind("marginAmount", function (v) { return v; });
    bind("paperSlippageBps", function (v) { return v; });
    bind("paperRejectPct", function (v) { return Math.min(100, v); });
    // Paper execution-latency: the ms field is a non-negative whole number; the
    // checkbox is the master on/off. Off means the engine never queues a
    // delayed entry (fully inactive), so the paper book fills instantly.
    bind("paperExecDelayMs", function (v) { return Math.round(v); });
    // Paper exit-latency: same idea as the entry delay, but for the cut
    // (SL / Trail-SL / Target). Off means an exit books inline at the trigger
    // level; on means it lands `paperExitDelayMs` later at the live mark.
    bind("paperExitDelayMs", function (v) { return Math.round(v); });
    // F&O Limit entry toggle: paper-only, buying-only. When on, the entry is
    // placed as a marketable limit above the market (Dhan-style), so it always
    // fills like a market order and never sits behind the entry.
    const fnoCb = funds.parentNode.querySelector('input[data-set="fnoLimitOrder"]');
    if (fnoCb) {
      fnoCb.addEventListener("change", function () {
        fetch("/api/rt/settings", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ fnoLimitOrder: !!fnoCb.checked }),
        });
      });
    }
    const delayCb = funds.parentNode.querySelector('input[data-set="paperExecDelayOn"]');
    if (delayCb) {
      delayCb.addEventListener("change", function () {
        fetch("/api/rt/settings", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ paperExecDelayOn: !!delayCb.checked }),
        });
      });
    }
    const exitDelayCb = funds.parentNode.querySelector('input[data-set="paperExitDelayOn"]');
    if (exitDelayCb) {
      exitDelayCb.addEventListener("change", function () {
        fetch("/api/rt/settings", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ paperExitDelayOn: !!exitDelayCb.checked }),
        });
      });
    }
    // Skip-when-margin-unavailable toggle: plain checkbox setting. When on, an
    // entry whose margin cannot be funded is dropped immediately and never
    // retried, so it can never fill late once margin frees.
    const marginSkipCb = funds.parentNode.querySelector('input[data-set="skipOnMarginBlock"]');
    if (marginSkipCb) {
      marginSkipCb.addEventListener("change", function () {
        fetch("/api/rt/settings", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ skipOnMarginBlock: !!marginSkipCb.checked }),
        });
      });
    }
    // Dynamic margin toggle: when ON, the Margin ₹ field becomes the running
    // wallet base and realized P&L grows/shrinks it exactly like a real account.
    const dynMarginCb = funds.parentNode.querySelector('input[data-set="dynamicMarginOn"]');
    if (dynMarginCb) {
      dynMarginCb.addEventListener("change", function () {
        fetch("/api/rt/settings", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ dynamicMarginOn: !!dynMarginCb.checked }),
        });
      });
    }
    // Reset Margin: restore the running margin to the set amount and clear the
    // whole paper book (closed trades + logs + open simulated positions) so the
    // next trade starts again from the full margin - it stays reduced/increased
    // until this button is pressed.
    const resetMarginBtn = funds.parentNode.querySelector("#rtResetMargin");
    if (resetMarginBtn) {
      resetMarginBtn.addEventListener("click", function () {
        if (!confirm("Reset margin to the set amount and clear the paper trade book (closed trades + logs)?")) return;
        fetch("/api/rt/reset", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ what: "smart" }),
        }).then(function () { window.location.reload(); });
      });
    }
    // Deduct Dhan charges toggle: a plain checkbox setting. The shared pane reads
    // it back from `settings.brokerCharges` on every refresh and includes it in any
    // full settings write, so this only needs to push the new value.
    const chk = funds.parentNode.querySelector('input[data-set="brokerCharges"]');
    if (chk) {
      chk.addEventListener("change", function () {
        fetch("/api/rt/settings", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ brokerCharges: !!chk.checked }),
        });
      });
    }
  })();
</script>
</body>
</html>
